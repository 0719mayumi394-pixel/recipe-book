  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root {
      --bg-color-1: #fdf6f0;
      --bg-color-2: #fce8f3;
      --bg-color-3: #f0e8fb;
      --glass-bg:        rgba(255, 255, 255, 0.65);
      --glass-bg-strong: rgba(255, 255, 255, 0.85);
      --glass-border:    rgba(255, 255, 255, 0.90);
      --glass-shine:     rgba(255, 255, 255, 0.98);
      --text-main: rgba(70, 45, 80, 0.92);
      --text-sub:  rgba(110, 80, 120, 0.72);
      --accent-1: #9b59d0;
      --accent-2: #e06bab;
      --accent-glow: rgba(155, 89, 208, 0.25);
      --cat-washoku:  #059669;
      --cat-yoshoku:  #2563eb;
      --cat-chuka:    #dc2626;
      --cat-pan:      #db2777;
      --cat-tsukuri:  #7c3aed;
      --space-xs: 0.5rem;
      --space-sm: 1rem;
      --space-md: 2rem;
      --space-lg: 4rem;
      --space-xl: 6rem;
      --radius-sm: 4px;
      --radius-md: 12px;
      --radius-lg: 20px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    html, body { overflow-x: hidden; }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      color: var(--text-main);
      line-height: 1.8;
      letter-spacing: 0.03em;
      background:
        radial-gradient(circle at 15% 20%, rgba(252, 215, 232, 0.6) 0%, transparent 50%),
        radial-gradient(circle at 85% 80%, rgba(240, 232, 251, 0.6) 0%, transparent 50%),
        linear-gradient(135deg, var(--bg-color-1), var(--bg-color-2), var(--bg-color-3));
      min-height: 100vh;
      min-height: 100dvh;
    }

    h1, h2, h3 { overflow-wrap: break-word; }

    /* ナビ */
    .nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: var(--space-sm) var(--space-md);
      background: rgba(255, 248, 252, 0.75);
      backdrop-filter: blur(20px) saturate(1.5);
      -webkit-backdrop-filter: blur(20px) saturate(1.5);
      border-bottom: 1px solid var(--glass-border);
      transition: background 0.3s, box-shadow 0.3s;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .nav.is-scrolled {
      background: rgba(255, 248, 252, 0.92);
      box-shadow: 0 2px 12px rgba(180, 140, 200, 0.2);
    }
    .nav__logo {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: 0.03em;
      color: var(--text-main);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .nav.is-scrolled .nav__logo { color: var(--accent-1); }
    .nav__logo .material-icons { font-size: 1.4rem; color: var(--accent-1); filter: drop-shadow(0 0 8px var(--accent-glow)); }

    /* ヒーロー（一覧画面のタイトル部分） */
    .hero {
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, rgba(252, 215, 232, 0.5) 0%, rgba(240, 232, 251, 0.5) 100%);
      backdrop-filter: blur(30px) saturate(1.5);
      -webkit-backdrop-filter: blur(30px) saturate(1.5);
      border-bottom: 1px solid var(--glass-border);
      padding: calc(var(--space-xl) + 60px) var(--space-md) var(--space-xl);
      text-align: center;
    }
    .hero__inner { position: relative; z-index: 1; }
    /* ふわっとした丸い色面の飾り */
    .hero__blob {
      position: absolute;
      z-index: 0;
      border-radius: 45% 55% 60% 40% / 50% 45% 55% 50%;
      pointer-events: none;
      animation: hero-float 7s ease-in-out infinite;
    }
    .hero__blob--left  { left: -50px; bottom: 8%; width: 220px; height: 200px; background: var(--accent-1); opacity: 0.22; }
    .hero__blob--right { right: -50px; top: 10%; width: 190px; height: 175px; background: var(--accent-2); opacity: 0.20; animation-duration: 8s; animation-direction: reverse; }
    .hero__dot {
      position: absolute;
      z-index: 0;
      border-radius: 50%;
      pointer-events: none;
      animation: hero-float 5s ease-in-out infinite;
    }
    .hero__dot--1 { left: 9%;  top: 20%;    width: 32px; height: 32px; background: var(--accent-2); opacity: 0.35; }
    .hero__dot--2 { right: 7%; bottom: 16%; width: 24px; height: 24px; background: var(--accent-1); opacity: 0.35; animation-duration: 6s; animation-direction: reverse; }
    @keyframes hero-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
    @media (prefers-reduced-motion: reduce) { .hero__blob, .hero__dot { animation: none; } }
    .hero__eyebrow {
      font-size: 0.875rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: var(--accent-1);
      margin-bottom: var(--space-xs);
      filter: drop-shadow(0 0 6px var(--accent-glow));
    }
    .hero__title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.6rem, 5.5vw, 4.4rem);
      font-weight: 700;
      font-style: italic;
      margin-bottom: var(--space-sm);
      letter-spacing: 0.02em;
      background: linear-gradient(135deg, var(--accent-2) 0%, var(--accent-1) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero__lead {
      font-size: 1rem;
      color: var(--text-sub);
      max-width: 480px;
      margin: 0 auto var(--space-md);
    }
    .hero__stats {
      display: inline-flex;
      gap: var(--space-md);
      background: var(--glass-bg);
      backdrop-filter: blur(20px) saturate(1.5);
      -webkit-backdrop-filter: blur(20px) saturate(1.5);
      border: 1px solid var(--glass-border);
      border-radius: 100px;
      padding: 0.6rem 1.5rem;
      font-size: 0.9rem;
      font-weight: 700;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2), inset 0 1px 0 var(--glass-shine);
    }
    .hero__stats span { display: flex; align-items: center; gap: 0.3rem; }
    .hero__stats .material-icons { font-size: 1rem; color: var(--accent-1); }

    /* 一覧画面の中身の幅 */
    .content {
      max-width: 960px;
      margin: 0 auto;
      padding: var(--space-lg) var(--space-md);
      display: flex;
      flex-direction: column;
      gap: var(--space-lg);
    }

    /* カテゴリブロック */
    .category__header {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      margin-bottom: var(--space-md);
      padding-bottom: var(--space-sm);
      border-bottom: 2px solid currentColor;
    }
    .category__icon {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: var(--glass-bg-strong);
      backdrop-filter: blur(20px) saturate(1.5);
      -webkit-backdrop-filter: blur(20px) saturate(1.5);
      border: 1px solid currentColor;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .category__icon .material-icons { font-size: 1.4rem; color: currentColor; }
    .category__name { font-size: 1.2rem; font-weight: 900; }
    .category__count {
      margin-left: auto;
      font-size: 0.8rem;
      font-weight: 700;
      background: currentColor;
      color: #fff;
      padding: 0.2rem 0.7rem;
      border-radius: 100px;
    }

    /* カテゴリカラー */
    .category--washoku { color: var(--cat-washoku); }
    .category--yoshoku { color: var(--cat-yoshoku); }
    .category--chuka   { color: var(--cat-chuka); }
    .category--pan     { color: var(--cat-pan); }
    .category--tsukuri { color: var(--cat-tsukuri); }

    /* レシピグリッド */
    .recipe-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: var(--space-sm);
    }

    /* レシピカード */
    .recipe-card {
      background: var(--glass-bg);
      backdrop-filter: blur(24px) saturate(1.5);
      -webkit-backdrop-filter: blur(24px) saturate(1.5);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      padding: var(--space-md);
      text-decoration: none;
      color: var(--text-main);
      transition: transform 0.2s ease, background 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), inset 0 1px 0 var(--glass-shine);
      cursor: pointer;
    }
    .recipe-card:hover {
      transform: translateY(-4px);
      background: var(--glass-bg-strong);
    }
    .recipe-card__top { display: flex; align-items: center; gap: var(--space-xs); }
    .recipe-card__dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
    .recipe-card__tag { font-size: 0.72rem; font-weight: 700; color: currentColor; }
    .recipe-card__name { font-size: 1.05rem; font-weight: 700; line-height: 1.4; }
    .recipe-card__meta {
      font-size: 0.78rem;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      gap: 0.3rem;
      flex-wrap: wrap;
    }
    .recipe-card__meta .material-icons { font-size: 0.95rem; color: var(--accent-1); }

    /* お気に入りボタン（一覧カード・詳しいページ、両方で共通） */
    .fav-btn {
      margin-left: auto;
      border: none; background: transparent; padding: 0.15rem;
      display: flex; align-items: center; cursor: pointer;
      color: var(--text-sub); opacity: 0.55;
      transition: transform 0.15s ease, opacity 0.15s ease, color 0.15s ease;
    }
    .fav-btn .material-icons { font-size: 1.25rem; }
    .fav-btn:hover { opacity: 1; transform: scale(1.12); }
    .fav-btn.is-fav { color: #e0a930; opacity: 1; }
    .fav-btn--lg { margin-left: 0; padding: 0.2rem; }
    .fav-btn--lg .material-icons { font-size: 1.4rem; }

    /* 検索・絞り込み */
    .filter-bar {
      background: var(--glass-bg);
      backdrop-filter: blur(24px) saturate(1.5);
      -webkit-backdrop-filter: blur(24px) saturate(1.5);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      padding: var(--space-md);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2), inset 0 1px 0 var(--glass-shine);
    }
    .search-box {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: var(--glass-bg-strong);
      border: 1px solid var(--glass-border);
      border-radius: 100px;
      padding: 0.7rem 1.2rem;
      margin-bottom: var(--space-sm);
    }
    .search-box .material-icons { color: var(--accent-1); }
    .search-box input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      font: inherit;
      color: var(--text-main);
    }
    .chip-row { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .chip {
      border: 1px solid var(--glass-border);
      background: var(--glass-bg-strong);
      border-radius: 100px;
      padding: 0.4rem 1rem;
      font-size: 0.85rem;
      font-weight: 700;
      font-family: inherit;
      color: var(--text-main);
      cursor: pointer;
    }
    .chip.is-active { background: var(--accent-1); color: #fff; border-color: var(--accent-1); }
    .chip--fav { display: inline-flex; align-items: center; gap: 0.3rem; }
    .chip--fav .material-icons { font-size: 1rem; }
    .chip--fav.is-active { background: #e0a930; border-color: #e0a930; color: #fff; }
    .filter-result { margin-top: 0.7rem; font-size: 0.85rem; color: var(--text-sub); }
    .empty-state {
      text-align: center;
      padding: var(--space-lg) var(--space-md);
      color: var(--text-sub);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
    }
    .empty-state .material-icons { font-size: 2.2rem; color: var(--accent-1); opacity: 0.6; }

    /* 空カード */
    .recipe-empty {
      border: 2px dashed var(--glass-border);
      border-radius: var(--radius-md);
      padding: var(--space-md);
      color: var(--text-sub);
      font-size: 0.875rem;
      display: flex;
      align-items: center;
      gap: var(--space-xs);
    }
    .recipe-empty .material-icons { font-size: 1.1rem; color: var(--accent-1); }

    /* フッター */
    .footer {
      background: rgba(255, 240, 250, 0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--glass-border);
      padding: var(--space-md);
      text-align: center;
      color: var(--text-sub);
    }
    .footer__copy { font-size: 0.875rem; opacity: 0.6; }

    /* アニメーション */
    .fi {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .fi.is-visible { opacity: 1; transform: translateY(0); }

    /* ============ ここから：レシピ1品の詳しいページの見た目 ============ */
    #view-detail { padding-top: calc(48px + 0.5rem); }
    .back-link {
      display: inline-flex; align-items: center; gap: 0.3rem;
      color: var(--accent-1); text-decoration: none; font-weight: 700;
      font-size: 0.9rem; margin: 0.8rem 0 0.6rem;
    }
    .back-link .material-icons { font-size: 1.1rem; }

    .detail-grid {
      max-width: 960px; margin: 0 auto;
      padding: 0.5rem 1rem 2rem;
      display: grid;
      grid-template-areas: "hero hero" "ingredients steps" "tips tips";
      grid-template-columns: 5fr 7fr;
      gap: 1rem; align-items: start;
    }
    @media (max-width: 720px) {
      .detail-grid {
        grid-template-areas: "hero" "ingredients" "steps" "tips";
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: var(--glass-bg);
      backdrop-filter: blur(24px) saturate(1.5);
      -webkit-backdrop-filter: blur(24px) saturate(1.5);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 1.2rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15), inset 0 1px 0 var(--glass-shine);
    }

    .section__label {
      font-size: 0.8rem; font-weight: 700; color: var(--accent-1);
      letter-spacing: 0.1em; margin-bottom: 0.3rem;
      display: flex; align-items: center; gap: 0.4rem;
    }
    .section__title { font-size: 1.3rem; font-weight: 900; margin-bottom: 1rem; }

    .d-hero { grid-area: hero; display: flex; align-items: center; justify-content: space-between; gap: 1.2rem; flex-wrap: wrap; }
    .d-hero__text { flex: 1; min-width: 200px; }
    .d-hero__sub { font-size: 0.95rem; color: var(--text-sub); margin-bottom: 0.3rem; }
    .d-hero__title-row { display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; }
    .d-hero__title {
      font-size: clamp(1.8rem, 4vw, 2.6rem); font-weight: 900; line-height: 1.25; margin-bottom: 0.8rem;
      background: linear-gradient(135deg, var(--accent-2) 0%, var(--accent-1) 100%);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    .d-hero__meta { display: flex; flex-wrap: wrap; gap: 0.6rem; }
    .d-badge {
      display: inline-flex; align-items: center; gap: 0.4rem;
      background: var(--glass-bg-strong);
      border: 1px solid var(--glass-border);
      border-radius: 100px; padding: 0.35rem 0.9rem;
      font-size: 0.85rem; font-weight: 700;
    }

    };

    // 文字の中に < > & があってもこわれないようにする（安全対策）
    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // お気に入りは、この端末のブラウザに覚えさせる（クリックした瞬間に切り替わる）
    // window.RECIPES の「お気に入り」は、まだ一度もクリックしていないときの「最初の状態」として使う
    function お気に入りキー(id) { return "mkn-fav-" + id; }
    function お気に入りか(r) {
      const 保存値 = localStorage.getItem(お気に入りキー(r.id));
      if (保存値 !== null) return 保存値 === "1";
      return !!r.お気に入り;
    }
    function お気に入りを切り替える(id) {
      const 今 = localStorage.getItem(お気に入りキー(id));
      localStorage.setItem(お気に入りキー(id), (今 === "1") ? "0" : "1");
    }

    // カタカナをひらがなに変換する（「ナス」と「なす」を自動で同じ扱いにするため）
    function ひらがなに変換(s) {
      return String(s).replace(/[ァ-ヶ]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60));
    }

    // 漢字とひらがなで見た目がまったく違う言葉（カタカナ変換だけでは吸収できないもの）
    // 新しいレシピを増やして、また別の表記ゆれに気づいたら、ここに1行足せばよい
    const 同じ意味の言葉 = {
      "茄子":   ["なす", "なすび"],
      "生姜":   ["しょうが"],
      "玉ねぎ": ["たまねぎ"],
      "鶏がら": ["とりがら"],
    };

    function 同義語を展開する(q) {
      const 候補 = new Set([q]);
      for (const [代表語, 言い換え一覧] of Object.entries(同じ意味の言葉)) {
        if (q === 代表語 || 言い換え一覧.includes(q)) {
          候補.add(代表語);
          言い換え一覧.forEach(w => 候補.add(w));
        }
      }
      return [...候補];
    }

    // 料理名 または 材料の名前 に、入力した言葉が含まれているか調べる
    function 検索にひっかかるか(r, キーワード) {
      const q = ひらがなに変換(キーワード.trim());
      if (!q) return true;
      const 候補一覧 = 同義語を展開する(q).map(ひらがなに変換);
      const ヒットする = (text) => {
        const 変換後 = ひらがなに変換(text);
        return 候補一覧.some(w => 変換後.includes(w));
      };
      if (ヒットする(r.料理名)) return true;
      return (r.材料 || []).some(g => g.品目.some(i => ヒットする(i.名前)));
    }

    // ---- 画面に出てきたらふわっと表示 ----
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) e.target.classList.add("is-visible"); });
    }, { threshold: 0.08 });

    const 全レシピ = window.RECIPES || [];

    /* ============ 一覧画面 ============ */

    const viewList = document.getElementById("view-list");
    const viewDetail = document.getElementById("view-detail");
    const recipeList = document.getElementById("recipe-list");
    const searchInput = document.getElementById("search-input");
    const chipRow = document.getElementById("chip-row");
    const resultLabel = document.getElementById("filter-result");
    const detailContent = document.getElementById("detail-content");

    document.getElementById("stat-total").textContent = 全レシピ.length;

    let 選んだカテゴリ = ""; // "" = すべて
    let お気に入りだけ = false;

    function カードHTML(r, cat) {
      const meta = [];
      if (r.時間)    meta.push('<span class="material-icons">schedule</span>' + esc(r.時間));
      if (r.カロリー) meta.push('<span style="margin-left:0.4rem"><span class="material-icons">local_fire_department</span>' + esc(r.カロリー) + '</span>');
      if (r.人数)    meta.push('<span style="margin-left:0.4rem"><span class="material-icons">group</span>' + esc(r.人数) + '</span>');
      const metaHTML = meta.length ? '<p class="recipe-card__meta">' + meta.join("\n") + '</p>' : "";
      const お気に入り中 = お気に入りか(r);
      const 星ボタン = `<button type="button" class="fav-btn${お気に入り中 ? " is-fav" : ""}" data-fav-id="${esc(r.id)}" title="お気に入り">
          <span class="material-icons">${お気に入り中 ? "star" : "star_border"}</span>
        </button>`;
      return `
        <a class="recipe-card category--${cat.クラス}" href="#id=${esc(r.id)}">
          <div class="recipe-card__top">
            <div class="recipe-card__dot"></div>
            <span class="recipe-card__tag">${esc(cat.タグ)}</span>
            ${星ボタン}
          </div>
          <p class="recipe-card__name">${esc(r.料理名)}</p>
          ${metaHTML}
        </a>`;
    }

    function カテゴリHTML(cat, recipes) {
      const cards = recipes.length
        ? recipes.map(r => カードHTML(r, cat)).join("")
        : '<div class="recipe-empty"><span class="material-icons">add_circle_outline</span>レシピを追加しましょう</div>';
      return `
        <section class="category category--${cat.クラス} fi">
          <div class="category__header">
            <div class="category__icon"><span class="material-icons">${cat.アイコン}</span></div>
            <h2 class="category__name">${esc(cat.名前)}</h2>
            <span class="category__count">${recipes.length}</span>
          </div>
          <div class="recipe-grid">${cards}</div>
        </section>`;
    }

    function チップを描く() {
      const chips = [{ 名前: "", ラベル: "すべて" }, ...CATEGORIES.map(c => ({ 名前: c.名前, ラベル: c.名前 }))];
      chipRow.innerHTML = chips.map(c =>
        `<button type="button" class="chip${c.名前 === 選んだカテゴリ ? " is-active" : ""}" data-cat="${esc(c.名前)}">${esc(c.ラベル)}</button>`
      ).join("") + `<button type="button" class="chip chip--fav${お気に入りだけ ? " is-active" : ""}" id="fav-chip">
          <span class="material-icons">${お気に入りだけ ? "star" : "star_border"}</span>お気に入り
        </button>`;
      chipRow.querySelectorAll(".chip[data-cat]").forEach(btn => {
        btn.addEventListener("click", () => {
          選んだカテゴリ = btn.dataset.cat;
          チップを描く();
          一覧を描く();
        });
      });
      document.getElementById("fav-chip").addEventListener("click", () => {
        お気に入りだけ = !お気に入りだけ;
        チップを描く();
        一覧を描く();
      });
    }

    function 一覧を描く() {
      const キーワード = searchInput.value;
      const 絞込み中 = キーワード.trim().length > 0;

      const 対象カテゴリ = 選んだカテゴリ
        ? CATEGORIES.filter(c => c.名前 === 選んだカテゴリ)
        : CATEGORIES;

      let 表示件数 = 0;
      const sectionsHTML = 対象カテゴリ.map(cat => {
        const 該当レシピ = 全レシピ.filter(r =>
          r.カテゴリ === cat.名前 &&
          (!お気に入りだけ || お気に入りか(r)) &&
          検索にひっかかるか(r, キーワード)
        );
        表示件数 += 該当レシピ.length;
        if ((絞込み中 || お気に入りだけ) && 該当レシピ.length === 0) return "";
        return カテゴリHTML(cat, 該当レシピ);
      }).join("");

      if (表示件数 === 0) {
        recipeList.innerHTML = `
          <div class="empty-state fi">
            <span class="material-icons">search_off</span>
            <p>見つかりませんでした。別の言葉で試してみてください。</p>
          </div>`;
      } else {
        recipeList.innerHTML = sectionsHTML;
      }

      resultLabel.textContent = (絞込み中 || 選んだカテゴリ || お気に入りだけ) ? `${表示件数}件 見つかりました` : "";

      document.querySelectorAll(".fi").forEach(el => observer.observe(el));
    }

    recipeList.addEventListener("click", (event) => {
      const btn = event.target.closest(".fav-btn");
      if (!btn) return;
      event.preventDefault();
      event.stopPropagation();
      お気に入りを切り替える(btn.dataset.favId);
      一覧を描く();
    });

    searchInput.addEventListener("input", 一覧を描く);

    /* ============ 詳しいページ ============ */

    function 詳細を描く(r) {
      const badges = [];
      if (r.人数)     badges.push('<span class="d-badge"><span class="material-icons">group</span>' + esc(r.人数) + '</span>');
      if (r.時間)     badges.push('<span class="d-badge"><span class="material-icons">schedule</span>' + esc(r.時間) + '</span>');
      if (r.カロリー) badges.push('<span class="d-badge"><span class="material-icons">local_fire_department</span>' + esc(r.カロリー) + '</span>');
      badges.push('<span class="d-badge"><span class="material-icons">restaurant</span>' + esc(r.カテゴリ) + '</span>');

      const photoHTML = r.写真
        ? `<img src="${写真データ[r.写真] || ("写真/" + esc(r.写真))}" alt="${esc(r.料理名)}の写真">`
        : `<span class="material-icons">${CATEGORY_ICON[r.カテゴリ] || "restaurant"}</span>`;

      const お気に入り中 = お気に入りか(r);
      const 星ボタン = `<button type="button" class="fav-btn fav-btn--lg${お気に入り中 ? " is-fav" : ""}" data-fav-id="${esc(r.id)}" title="お気に入り">
          <span class="material-icons">${お気に入り中 ? "star" : "star_border"}</span>
        </button>`;

      const heroHTML = `
        <section class="d-hero panel">
          <div class="d-hero__text">
            ${r.ひとこと ? `<p class="d-hero__sub">${esc(r.ひとこと)}</p>` : ""}
            <div class="d-hero__title-row">
              <h1 class="d-hero__title">${esc(r.料理名)}</h1>
              ${星ボタン}
            </div>
            <div class="d-hero__meta">${badges.join("")}</div>
          </div>
          <div class="d-photo">${photoHTML}</div>
        </section>`;

      const groupsHTML = (r.材料 || []).map(g => `
        <div class="ingredients__group">
          ${g.グループ && g.グループ !== "材料" ? `<p class="ingredients__group-title">${esc(g.グループ)}</p>` : ""}
          <table class="ingredients__table">
            ${g.品目.map(i => `<tr><td>${esc(i.名前)}</td><td>${esc(i.分量)}</td></tr>`).join("")}
          </table>
        </div>`).join("");

      const ingredientsHTML = `
        <section class="ingredients panel">
          <p class="section__label"><span class="material-icons" style="font-size:1rem">list_alt</span>INGREDIENTS</p>
          <h2 class="section__title">材料</h2>
          ${groupsHTML}
        </section>`;

      const stepsHTML = `
        <section class="steps panel">
          <p class="section__label"><span class="material-icons" style="font-size:1rem">format_list_numbered</span>HOW TO MAKE</p>
          <h2 class="section__title">作り方</h2>
          <ol class="steps__list">
            ${(r.作り方 || []).map((s, i) => `
              <li class="step">
                <div class="step__number">${i + 1}</div>
                <p class="step__text">${esc(s)}</p>
              </li>`).join("")}
          </ol>
        </section>`;

      const tipsHTML = (r.メモ && r.メモ.length) ? `
        <section class="tips panel">
          <p class="section__label"><span class="material-icons" style="font-size:1rem">lightbulb</span>MEMO</p>
          <h2 class="section__title">メモ・コツ</h2>
          <ul class="tips__list">
            ${r.メモ.map(t => `<li class="tips__item"><span class="material-icons">lightbulb</span><span>${esc(t)}</span></li>`).join("")}
          </ul>
        </section>` : "";

      detailContent.innerHTML = `
        <a class="back-link" href="#"><span class="material-icons">arrow_back</span>一覧へ戻る</a>
        <div class="detail-grid">${heroHTML}${ingredientsHTML}${stepsHTML}${tipsHTML}</div>`;

      document.title = r.料理名 + " | M's Kitchen Notes";
    }

    detailContent.addEventListener("click", (event) => {
      const btn = event.target.closest(".fav-btn");
      if (!btn) return;
      event.preventDefault();
      お気に入りを切り替える(btn.dataset.favId);
      const r = 全レシピ.find(x => x.id === btn.dataset.favId);
      if (r) 詳細を描く(r);
    });

    /* ============ 画面の切り替え（#id=◯◯ を見て、一覧⇔詳しいページ） ============ */

    function ルーティングする() {
      const params = new URLSearchParams(location.hash.replace(/^#/, ""));
      const id = params.get("id");
      const r = id ? 全レシピ.find(x => x.id === id) : null;

      if (id && r) {
        viewList.hidden = true;
        viewDetail.hidden = false;
        詳細を描く(r);
        window.scrollTo(0, 0);
      } else if (id && !r) {
        viewList.hidden = true;
        viewDetail.hidden = false;
        detailContent.innerHTML = `
          <div class="notfound">
            <p class="section__title">レシピが見つかりませんでした</p>
            <p style="color:var(--text-sub); margin-bottom:1rem;">一覧から選び直してください。</p>
            <a class="back-link" href="#"><span class="material-icons">arrow_back</span>一覧へ戻る</a>
          </div>`;
        document.title = "M's Kitchen Notes";
      } else {
        viewList.hidden = false;
        viewDetail.hidden = true;
        document.title = "M's Kitchen Notes";
        チップを描く();
        一覧を描く();
      }
    }

    window.addEventListener("hashchange", ルーティングする);
    ルーティングする();

    const nav = document.getElementById("nav");
    window.addEventListener("scroll", () => {
      nav.classList.toggle("is-scrolled", window.scrollY > 50);
    });
  </script>
</body>
</html>
